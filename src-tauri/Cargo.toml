[package]
name = "relay-terminal"
version = "3.0.0"
description = "An intuitive PowerShell terminal for Windows"
authors = ["Relay"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
rfd = "0.15"
arboard = { version = "3", default-features = false }
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Storage_FileSystem"] }

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
